kind = "web"
previewPath = "/"
title = "Landlord Management"
version = "1.0.0"
id = "artifacts/landlord-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25249

[services.development]
run = "pnpm --filter @workspace/landlord-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landlord-app", "run", "build" ]
publicDir = "artifacts/landlord-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25249"
BASE_PATH = "/"
