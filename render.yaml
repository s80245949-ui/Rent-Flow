services:
  - type: web
    name: rentease
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/landlord-app run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
